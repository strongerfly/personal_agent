l></div><section class="panel" id="court-cases"><div class="panel-head"><div class="filters" role="group" aria-label="按公文阶段筛选">${[['all','全部'],...Object.entries(courtStages)].map(([status,label])=>`<button class="filter ${courtFilter===status?'active':''}" data-court-filter="${e(status)}" aria-pressed="${courtFilter===status}">${e(label)}</button>`).join('')}</div>${['planning','delivery'].includes(courtFilter)?chip(courtFilter==='planning'?'中书省 · 拟案与退回':'尚书省 · 待执行与执行中','jade'):''}</div><div class="panel-body court-case-list">${courtCases()}</div></section></div>`}
function proposalPlan(proposal){return `<div class="hint"><strong>${e(proposal.title)}</strong><p style="margin-top:6px;white-space:pre-wrap">${e(proposal.intent||'')}</p><div class="meta">${chip(proposal.dept||'未设置')}${chip(courtStages[proposal.status]||'拟案')}<span>版本 ${e(proposal.revision||1)}</span>${proposal.status==='paused'?chip('暂停前：'+(courtStages[proposal.pausedFrom]||'未知阶段'),'orange'):''}${needsSupplementaryReview(proposal)?chip('需补充四项审议','orange'):''}${proposal.goalId?`<span>目标：${e(goalTitle(proposal.goalId))}</span>`:''}</div></div><div class="court-steps">${list(proposal.steps).map((step,index)=>`<div class="court-step"><div class="goal-head"><h3>${index+1}. ${e(step.title)}</h3>${chip((Number(step.minutes)||0)+' 分钟','outline')}</div><p>验收标准：${e(step.acceptance)}</p></div>`).join('')}</div>`}

function proposalGateRecords(proposal){const acceptance=proposal.acceptance;return `${proposal.review?`<details class="court-gate-record"><summary>最近审议结论与检查理由</summary>${reviewRecord(proposal.review)}</details>`:''}${acceptance?`<section class="court-gate-record"><h3>${acceptance.method==='self-review'?'本人逐项验收':'验收记录'}</h3>${acceptance.note?`<p>${e(acceptance.note)}</p>`:''}${list(acceptance.checks).length?acceptance.checks.map((check,index)=>{const task=proposalTasks(proposal).find(item=>item.id===check.taskId);return `<div class="court-gate-result"><h3>${index+1}. ${e(task?.title||check.taskId)}</h3><div class="meta">${chip(check.passed===true?'本人核对通过':'未通过',check.passed===true?'jade':'orange')}</div><p>${e(check.reason||'未记录理由')}</p></div>`}).join(''):'<p>此历史验收未记录逐项检查理由。</p>'}</section>`:''}`}
function proposalHistory(proposal){

></div><div class="form-actions"><button class="button primary" type="submit">记入史馆</button></div></form>${checkin?`<div class="divider"></div><div class="section-caption">今天最近的记录 · ${e(formatDate(checkin.createdAt,true))}</div><p class="row-note">${e(checkin.note)}</p>`:''}</div></section><section class="panel pad"><div class="eyebrow">学而时习</div><h2 style="font-size:20px">让阅读，走向一次行动。</h2><p class="subtitle">导入读书笔记，试着不看原文回忆，再把一个想法变成练习。</p><button class="button text" style="margin-top:13px" data-go="learning">打开学习台 →</button></section></div></div>`}
function renderActions(){const visible=newest(tasks()).filter(item=>taskFilter==='全部'||(taskFilter==='暂停/取消'?taskIsBlocked(item):item.status===taskFilter&&!taskIsBlocked(item))),goals=list(state.goals);return heading('DIRECTION & ACTION','目标有方向，行动有回响。','用一个明确的目标串起行动，以可观察的结果作为完成证据。','<button class="button primary" data-action="new-task">＋ 添加行动</button>')+`<div class="grid cols"><section class="panel"><div class="panel-head"><div><h2>行动清单</h2><p class="panel-desc">${tasks().length} 项行动 · ${tasks().filter(item=>item.status==='已完成').length} 项已完成</p></div></div><div class="panel-body"><div class="filters" role="group" aria-label="按行动状态筛选">${['全部','待确认','执行中','已完成','已顺延','暂停/取消'].map(value=>`<button class="filter ${taskFilter===value?'active':''}" data-task-filter="${value}" aria-pressed="${taskFilter===value}">${value}</button>`).join('')}</div>${visible.length?visible.map(taskRow).join(''):empty(taskFilter==='全部'?'从一个小行动开始':'这里暂时没有行动','写清楚要做什么，完成时留下结果。','添加行动','new-task')}</div></section><div class="stack"><section class="panel"><div class="panel-head"><div><h2>我的目标</h2><p class="panel-desc">为什么做，比做多少更重要</p></div><button class="button text" data-action="new-goal">＋ 新目标</button></div>${goals.length?goals.map(goal=>{const linked=tasks().filter(item=>item.goalId===goal.id),completed=linked.filter(item=>item.status==='已完成').length,percent=linked.length?Math.round(completed/linked.length*100):0;return `<article class="goal-card"><div class="goal-head"><h3 class="goal-title">${e(goal.title)}</h3>${chip(goal.status==='completed'?'已达成':'进行中',goal.status==='completed'?'jade':'')}</div><p class="goal-why">${e(goal.why||'每一个小行动，都是靠近目标的一步。')}</p><div class="progress" aria-label="关联行动完成率 ${percent}%"><span style="width:${percent}%"></span></div><div class="goal-meta"><span>${completed} / ${linked.length} 项关联行动</span><span>${goal.targetDate?'目标 '+e(formatDate(goal.targetDate)):'未设置目标日期'}</span></div><div class="actions" style="margin-top:15px"><button class="button small" data-action function renderLearning(){return heading('READ, RECALL, APPLY','学过的，慢慢成为自己的。','把笔记留在身边，用回忆巩固理解，用一个练习检验所得。','<button class="button primary" data-action="import-reading">＋ 导入笔记</button>')+`<div class="toolbar"><div class="filters" role="group" aria-label="筛选笔记">${['全部','待复习'].map(value=>`<button class="filter ${readingFilter===value?'active':''}" data-reading-filter="${value}" aria-pressed="${readingFilter===value}">${value} · ${value==='全部'?list(state.reading).length:list(state.reading).filter(reviewDue).length}</button>`).join('')}</div><input class="search" id="reading-search" type="search" value="${e(readingQuery)}" aria-label="搜索书名、作者或笔记" placeholder="搜索书名、作者、笔记…"></div><div class="grid cols"><section class="panel" id="reading-list">${readingCards()}</section><div class="stack"><section class="panel pad"><div class="eyebrow">三个小步骤</div><h2>让知识开始流动</h2><div style="margin-top:18px">${[['01','留下触动你的句子','从微信读书、Markdown 或 JSON 导入笔记。'],['02','合上书，试着想一想','不看原文，写下核心观点和适用场景。'],['03','给它一次实践的机会','把一个观点转成一个可以完成的小练习。']].map(item=>`<div class="focus-item"><span class="focus-number">${item[0]}</span><div class="focus-main"><h3>${item[1]}</h3><p class="panel-desc">${item[2]}</p></div></div>`).join('')}</div></section><section class="panel pad"><h3>从 Obsidian 整理读书笔记</h3><p class="subtitle">设置自己的库目录后，可以读取 WeRead 文件夹中的笔记。首次使用先保存路径，再主动导入。</p><button class="button text" style="margin-top:12px" data-go="connections">配置连接 →</button></section></div></div>`}

function renderConnections(){const settings=state.settings||{},ai=settings.ai||{},auto=state.automation||{},runs=newest(state.runs);return heading('TOOLS WITH BOUNDARIES','工具就位，节奏由你。','本地整理、笔记连接与可选的模型分析，都从清楚的配置开始。','<a class="button" href="/api/export" download>↓ 导出全部数据</a>')+`<div class="grid equal"><div class="stack"><section class="panel"><div class="panel-head"><div class="connection"><div class="connection-icon">${sysIcon('learning')}</div><div><h2>Obsidian 笔记库</h2><p class="panel-desc">${e(integrationStatus('obsidian'))}</p></div></div></div><div class="panel-body"><form id="vault-settings"><div class="field"><label for="vault-path">笔记库完整路径</label><input id="vault-path" name="vaultPath" value="${e(settings.vaultPath||'')}" placeholder="例如 D:\\Notes\\MyVault"><small>可以先保存路径。文件读取由运行此服务的电脑执行。</small></div><div class="field form-section"><label for="reading-folder">微信读书笔记文件夹</label><input id="reading-folder" name="readingFolder" value="${e(settings.readingFolder||'WeRead')}" placeholder="WeRead"><small>相对于笔记库的目录，用于读取已有 Markdown 笔记。</small></div><div class="form-actions"><button class="button" type="submit">保存路径</button></div></form><div class="divider"></div><div class="actions"><button class="button" data-action="obsidian-import">读取读书笔记</button><button class="button primary" data-action="obsidian-preview">预览整理结果</button></div><p class="panel-desc" style="margin-top:12px">先预览将要写入的完整文件内容，再批准导出。</p></div></section><section class="panel"><div class="panel-head"><div><h2>自动整理</h2><p class="panel-desc">运行时区：Asia/Shanghai（北京时间）</p></div></div><div class="panel-body"><form id="automation-form"><label class="checkbox-field"><input type="checkbox" name="enabled" ${auto.enabled?'checked':''}>启用定时整理</label><div class="form-grid form-section"><div class="field"><label for="daily-hour">每天日报时间</label><select id="daily-hour" name="dailyHour">${hourOptions(auto.dailyHour??21)}</select></div><div class="field"><label for="weekly-day">每周复盘日</label><select id="weekly-day" name="weeklyDay">${['周日','周一','周二','周三','周四','周五','周六'].map((day,i)=>`<option value="${i}" ${Number(auto.weeklyDay??0)===i?'selected':''}>${day}</option>`).join('')}</select></div><div class="field"><label for="weekly-hour">每周复盘时间</label><select id="weekly-hour" name="weeklyHour">${hourOptions(auto.weeklyHour??20)}</select></div><div class="field" style="align-content:end"><label class="checkbox-field"><input type="checkbox" name="autoImport" ${auto.autoImport?'checked':''}>整理前导入读书笔记</label></div></div><div class="form-actions"><button class="button" data-action="automation-tick" type="button">检查到期任务</button><button class="button primary" type="submit">保存自动整理</button></div></form><div class="hint" style="margin-top:15px">定时整理需要本地服务保持运行。写入笔记库和外部模型分析仍需单独批准。</div></div></section></div><div class="stack"><section class="panel"><div class="panel-head"><div class="connection"><div class="connection-icon">${sysIcon('brain')}</div><div><h2>可选模型分析</h2><p class="panel-desc">${e(integrationStatus('ai'))}</p></div></div></div><div class="panel-body"><form id="ai-settings"><label class="checkbox-field"><input type="checkbox" name="enabled" ${ai.enabled?'checked':''}>启用外部模型分析</label><div class="field form-section"><label for="ai-base">API 地址</label><input id="ai-base" name="baseUrl" type="url" value="${e(ai.baseUrl||'')}" placeholder="https://api.example.com/v1"><small>填写兼容服务的 API 地址，保存配置不会发起模型请求。</small></div><div class="field form-section"><label for="ai-model">模型名称</label><input id="ai-model" name="model" value="${e(ai.model||'')}" placeholder="填写服务支持的模型名称"></div><div class="hint" style="margin-top:15px">密钥仅通过服务端环境变量配置；此页面不会读取或显示密钥。每次发送前都会展示目的地和数据预览。</div><div class="form-actions"><button class="button" type="submit">保存模型配置</button></div></form><div class="divider"></div><form id="ai-question"><div class="field"><label for="analysis-question">想分析的问题</label><textarea id="analysis-question" name="question" required maxlength="2000" placeholder="例如：根据最近的行动与复盘，下周可以做哪一个调整？"></textarea></div><div class="form-actions"><button class="button primary" type="submit">预览将要发送的数据</button></div></form>${list(state.aiAnalyses).length?`<div class="divider"></div><div class="section-caption">最近的分析</div>${newest(state.aiAnalyses).slice(0,5).map(item=>`<details class="details"><summary>${e(item.question||'模型分析')} · ${e(formatDate(item.createdAt,true))}</summary>${analysisBody(item.analysis||item)}</details>`).join('')}`:''}</div></section><section class="panel"><div class="panel-head"><div><h2>运行记录</h2><p class="panel-desc">自动整理与手动检查的实际运行结果</p></div>${chip(runs.length+' 次')}</div><div class="panel-body">${runs.length?runs.slice(0,30).map(run=>`<div class="row"><div class="row-main"><div class="row-title">${e(run.type||'运行')}</div><div class="meta">${e(formatDate(run.createdAt,true))}</div>${run.error?`<div class="run-error">${e(typeof run.error==='string'?run.error:JSON.stringify(run.error))}</div>`:''}${list(run.warnings).length?`<div class="run-error">${list(run.warnings).map(warning=>e(typeof warning==='string'?warning:JSON.stringify(warning))).join('<br>')}</div>`:''}</div>${chip(run.status||'未知',['success','completed','succeeded','done'].includes(run.status)?'jade':['failed','error'].includes(run.status)?'red':'orange')}</div>`).join(''):empty('自动整理尚未运行','到期后自动整理，或点击「检查到期任务」查看执行结果。')}</div></section></div></div>`}
function openModal(title,description,content,wide=false){modalReturnFocus=document.activeElement;$('#modal').classList.toggle('wide',wide);$('#modal-content').innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${e(title)}</h2><p>${e(description)}</p></div><button class="modal-close" data-close-modal aria-label="关闭对话框">×</button></div><div id="modal-error"></div>${content}`;$('#modal-backdrop').hidden=false;$('.app').inert=true;document.body.style.overflow='hidden';requestAnimationFrame(()=>{const focus=$('input:not([type=hidden]),textarea,select,button:not([data-close-modal])',$('#modal'));(focus||$('#modal')).focus({preventScroll:true});$('#modal').scrollTop=0})}
function closeModal(force=false){if(modalBusy&&!force)return;$('#modal-backdrop').hidden=true;$('#modal-content').innerHTML='';$('.app').inert=false;document.body.style.overflow='';if(modalReturnFocus?.isConnected)modalReturnFocus.focus();else $('.nav button.active')?.focus()}
function modalButtons(submit,cancel='取消'){return `<div class="modal-actions"><button class="button" type="button" data-close-modal>${e(cancel)}</button><button class="button primary" type="submit">${e(submit)}</button></div>`}
function goalOptions(selected=''){return '<option value="">暂不关联目标</option>'+list(state.goals).map(goal=>`<option value="${e(goal.id)}" ${goal.id===selected?'selected':''}>${e(goal.title)}${goal.status==='completed'?'（已达成）':''}</option>`).join('')}
function openTask(task=null,goalId='',department=''){if(taskIsBlocked(task)){openBlockedTask(task);return}if(task?.experimentId&&experimentById(task.experimentId)?.status==='reviewed'){openModal('已复盘行动',task.title,`<div class="court-locked">此实验已复盘，行动与证据已锁定。可从成长画像创建下一轮实验。</div><p class="reading-excerpt">${e(task.evidence||'')}</p><div class="modal-actions"><button class="button" data-close-modal>关闭</button></div>`);return}if(task?.proposalId&&proposalById(task.proposalId)?.status==='completed'){openModal('已验收行动',task.title,`<div class="court-locked">此公文已验收，行动与证据已锁定。</div><div class="field"><span class="field-label">完成证据</span><p class="reading-excerpt">${e(task.evidence||'')}</p></div><div class="modal-actions"><button class="button" data-close-modal>关闭</button></div>`);return}if(task?.proposalId||task?.experimentId){openModal('更新执行状态与证据',task.experimentId?'此行动来自已启动的实验，方案已锁定。完成后回到成长画像复盘结果。':'此行动来自已批准的公文，任务内容、部门、时间预算和目标已锁定。',`<form id="task-form" data-id="${e(task.id)}" data-proposal-linked="true"><div class="court-locked"><strong>${e(task.title)}</strong>${e(task.dept)} · ${Number(task.minutes)||0} 分钟${task.goalId?' · '+e(goalTitle(task.goalId)):''}<p style="margin-top:7px">验收标准：${e(task.acceptance||(task.experimentId?'按照实验指标记录实际结果':'见所属公文'))}</p></div><div class="field"><label for="task-status">执行状态</label><select id="task-status" name="status">${['待确认','执行中','已顺延','已完成'].map(status=>`<option ${task.status===status?'selected':''}>${status}</option>`).join('')}</select></div><div class="field form-section"><label for="task-evidence">完成证据（已完成时必填）</label><textarea id="task-evidence" name="evidence" maxlength="4000" placeholder="写下具体产出、观察或反馈…">${e(task.evidence||'')}</textarea></div>${modalButtons('保存执行记录')}</form>`);return}const chosenDepartment=task?.dept||department||'兵部',knownDepartment=departmentDefinitions.some(item=>item.id===chosenDepartment);openModal(task?'编辑行动':'添加一个行动','描述一个可以完成、可以留下证据的具体结果。',`<form id="task-form" data-id="${e(task?.id||'')}"><div class="form-grid"><div class="field full"><label for="task-title">行动内容</label><input id="task-title" name="title" required maxlength="300" value="${e(task?.title||'')}" placeholder="例如：完成一页项目提案并收集反馈"></div><div class="field full"><label for="task-goal">关联目标</label><select id="task-goal" name="goalId">${goalOptions(task?.goalId||goalId)}</select></div><div class="field"><label for="task-due">计划完成时间</label><input id="task-due" type="datetime-local" name="dueAt" value="${e(dateInput(task?.dueAt))}"></div><div class="field"><label for="task-priority">优先级</label><select id="task-priority" name="priority">${['高','中','低'].map(value=>`<option ${(task?.priority||'中')===value?'selected':''}>${value}</option>`).join('')}</select></div><div class="field"><label for="task-dept">承办部门</label><select id="task-dept" name="dept" required>${!knownDepartment?`<option value="" selected disabled>请选择部门（原归属：${e(chosenDepartment)}）</option>`:''}${departmentDefinitions.map(item=>`<option value="${e(item.id)}" ${chosenDepartment===item.id?'selected':''}>${e(item.name)} · ${e(item.role)}</option>`).join('')}</select></div><div class="field"><label for="task-minutes">预计分钟数</label><input id="task-minutes" type="number" name="minutes" min="1" max="1440" required value="${e(task?.minutes||25)}"></div></div>${modalButtons(task?'保存修改':'添加行动')}</form>`)}
function openBlockedTask(task){const status=taskParentState(task),description=status==='paused'?'父方案已暂停。请先在公文档案中恢复方案，再继续操作关联行动。':status==='cancelled'?'父方案已取消，不可恢复。行动原有状态与证据保留，只读不可修改。':'此行动已结案，状态与证据已锁定。';openModal(taskLockLabel(task)||'行动已锁定',task.title,`<div class="court-locked">${e(description)}</div><div class="meta">${chip('原状态：'+task.status,'outline')}</div>${task.evidence?`<p class="reading-excerpt">完成证据：${e(task.evidence)}</p>`:''}<div class="modal-actions">${task.proposalId?`<button class="button" data-court-action="view-proposal" data-id="${e(task.proposalId)}">查看所属公文</button>`:''}<button class="button" data-close-modal>关闭</button></div>`)}
function openCapture(){openModal('捕获一份奏折','先把想法放下来，再决定如何推进。',`<form id="capture-form"><div class="field"><label for="capture-title">标题</label><input id="capture-title" name="title" required maxlength="300" placeholder="一个念头，或一件待办…"></div><div class="field form-section"><label for="capture-note">补充说明（选填）</label><textarea id="capture-note" name="note" maxlength="10000" placeholder="相关背景、灵感或期待的结果"></textarea></div>${modalButtons('放入收件箱')}</form>`)}
function openGoal(){openModal('给下一段路一个方向','目标可以不大，但最好知道它为什么对你重要。',`<form id="goal-form"><div class="field"><label for="goal-title">目标</label><input id="goal-title" name="title" required maxlength="300" placeholder="例如：完成第一次公开分享"></div><div class="field form-section"><label for="goal-why">为什么想做（选填）</label><textarea id="goal-why" name="why" maxlength="2000" placeholder="它会给你带来什么改变？"></textarea></div><div class="field form-section"><label for="goal-target">目标日期（选填）</label><input id="goal-target" type="date" name="targetDate"></div>${modalButtons('保存目标')}</form>`)}
function openComplete(task){if(taskLockLabel(task)){openBlockedTask(task);return}openModal('为这次完成，留一份证据',task.title,`<form id="complete-form" data-id="${e(task.id)}"><div class="field"><label for="complete-evidence">完成证据</label><textarea id="complete-evidence" name="evidence" required maxlength="4000" placeholder="写下产出、作品链接、具体观察或收到的反馈…"></textarea><small>这段记录会进入复盘，帮助你看到实际发生的改变。</small></div>${modalButtons('记录完成')}</form>`)}
function openReadingImport(){openModal('导入阅读笔记','支持 JSON、Markdown 和纯文本；文件在浏览器内读取后提交给本地服务。',`<form id="reading-import-form"><div class="form-grid"><div class="field"><label for="import-format">内容格式</label><select id="import-format" name="format"><option value="markdown">Markdown</option><option value="text">纯文本</option><option value="json">JSON</option></select></div><div class="field"><label for="import-title">默认标题（选填）</label><input id="import-title" name="title" maxlength="300" placeholder="书名或笔记标题"></div><div class="field full"><label for="import-file">选择文件（选填，最大 900 KB）</label><input id="import-file" type="file" accept=".md,.markdown,.txt,.json,text/plain,application/json"><small>也可以直接将文本粘贴到下面。</small></div><div class="field full"><label for="import-text">笔记内容</label><textarea id="import-text" name="text" required rows="10" style="min-height:230px" placeholder="# 书名&#10;作者：…&#10;&#10;最想记住的观点与自己的思考"></textarea><small>JSON 支持对象数组，字段可包含 title、author、note、quote、tags。</small></div></div>${modalButtons('导入并保存')}</form>`,true)}
function openReadingReview(item){openModal('合上书，先试着回忆',item.title||'阅读笔记',`<form id="reading-review-form" data-id="${e(item.id)}"><div class="hint">这段内容的核心观点是什么？它解释了什么问题？你能想到一个自己的例子吗？先用自己的话写一遍，再展开笔记核对。</div><div class="field form-section"><label for="recall-answer">我的回忆</label><textarea id="recall-answer" name="answer" required maxlength="4000" placeholder="不看原文，写下现在能回忆起来的内容…"></textarea></div><button class="button small" type="button" style="margin-top:12px" data-action="reveal-reading">写好了，核对原笔记</button><div id="recall-source" hidden><div class="divider"></div>${item.quote?`<blockquote class="quote">${e(item.quote)}</blockquote>`:''}<p class="reading-excerpt">${e(item.note||'暂无笔记正文')}</p></div><div class="modal-actions"><button class="button" type="submit" name="rating" value="again">忘记，再看一次</button><button class="button primary" type="submit" name="rating" value="good">记得</button></div></form>`)}
function openReadingTask(item){openModal('把所学，变成一次实践',item.title,`<form id="reading-task-form" data-id="${e(item.id)}"><div class="field"><label for="practice-title">准备做什么练习？</label><input id="practice-title" name="title" required maxlength="300" placeholder="例如：选一个工作场景，试用笔记中的方法"></div>${modalButtons('添加练习行动')}</form>`)}
async function previewObsidian(button){await perform('obsidian-preview',button,async()=>{const preview=await api('/api/obsidian/preview',{method:'POST',body:'{}'}),files=list(preview.files);openModal('确认将要写入的笔记','请逐个查看路径、状态和完整内容；批准后才会写入。',`<div class="hint"><strong>目标笔记库</strong><div class="path">${e(preview.vaultPath||state.settings.vaultPath||'')}</div>${preview.expiresAt?`<div>预览有效至 ${e(formatDate(preview.expiresAt,true))}</div>`:''}</div>${files.length?files.map(file=>`<details class="preview-file" open><summary>${e(file.path)} ${chip(file.status||'待写入')}</summary><pre class="file-content">${e(file.content)}</pre></details>`).join(''):empty('没有待写入的文件','先记录行动或生成复盘，再预览整理结果。')}<form id="obsidian-export-form" data-preview-id="${e(preview.previewId)}"><div class="modal-actions"><button class="button" type="button" data-close-modal>取消</button><button class="button primary" type="submit" ${files.length?'':'disabled'}>批准写入 ${files.length} 个文件</button></div></form>`,true)})}
function openAiPreview(question,preview){openModal('确认这次模型分析','批准后，下面展示的数据将发送到配置的服务。',`<div class="hint"><div><strong>目的地：</strong><span class="path">${e(preview.destination||state.settings.ai?.baseUrl||'未设置')}</span></div><div><strong>模型：</strong>${e(preview.model||state.settings.ai?.model||'未设置')}</div>${preview.expiresAt?`<div>预览有效至 ${e(formatDate(preview.expiresAt,true))}</div>`:''}</div><details class="preview-file" open><summary>实际将发送的数据与字段</summary><pre class="file-content">${e(JSON.stringify(preview.payload||preview,null,2))}</pre></details><form id="ai-run-form" data-preview-id="${e(preview.previewId)}"><input type="hidden" name="question" value="${e(question)}">${modalButtons('批准发送并分析','暂不发送')}</form>`,true)}
async function submitModal(form,url,data,message,method='POST',button=form.querySelector('[type=submit]')){return perform(url,button,async()=>{const result=await api(url,{method,body:JSON.stringify(data)});if(typeof result?.imported==='number'&&!result.imported&&!result.updated&&list(result.errors).length){modalError(list(result.errors).map(item=>`记录 ${Number(item.index||0)+1}：${item.message}`).join('\n'));return result}closeModal(true);resultNotice(message,result,await refresh());return result},true)}

function subjectLabel(value){return ({self:'自己',person:'人',event:'事情',object:'事物',decision:'决策'})[value]||'议题'}
function thinkingDetail(item){const analysis=item.analysis||{},ai=analysis.mode==='ai';return `<section class="panel"><div class="t-case-head"><div class="meta" style="margin:0 0 10px">${chip(subjectLabel(item.subjectType),'outline')}${chip('版本 '+item.revision,'outline')}${chip(ai?'模型辅助分析':'本地思考提纲',ai?'jade':'')}</div><h2>${e(item.title)}</h2><p class="subtitle" style="white-space:pre-wrap">${e(item.question)}</p><div class="actions"><button class="button small" data-growth-action="edit-case" data-id="${e(item.id)}">补充事实与问题</button><button class="button small primary" data-growth-action="ai-preview" data-id="${e(item.id)}">${sysIcon('brain')}预览模型思辨</button><button class="button text small" data-growth-action="case-experiment" data-id="${e(item.id)}">设计验证实验 →</button></div></div><div class="t-inputs"><div class="t-input"><h3>${sysIcon('evidence')}事实记录 · 待核实的输入</h3><p>${e(item.facts)}</p></div><div class="t-input assumption"><h3>${sysIcon('critical')}假设与判断 · 允许被推翻</h3><p>${e(item.assumptions||'暂未填写。哪些部分只是你的解释或预期？')}</p></div>${item.context?`<div class="t-input" style="grid-column:1/-1"><h3>${sysIcon('history')}情境与边界</h3><p>${e(item.context)}</p></div>`:''}<div style="grid-column:1/-1">${sourceReferences(item.sourceIds)}</div></div></section>${thinkingReflections(item)}<div class="t-section"><div class="t-mode">${ai?'模型辅助 · 单一模型模拟多种思考视角，不代表多位独立专家。结论与因果关系均为待验证假说。':'本地提纲 · 以下内容是按所选学科生成的追问框架，尚未经过 AI 推理，不是对你或事件的事实结论。'}${analysis.summary?`<p style="margin-top:7px;white-space:pre-wrap">${e(analysis.summary)}</p>`:''}</div>${list(analysis.citations).length?`<div class="panel pad" style="margin-bottom:18px"><h3>本轮分析的输入引用</h3><p class="panel-desc">引用表示该记录参与分析，不代表其已被独立证实。</p>${sourceReferences(analysis.citations)}</div>`:''}<h3 class="t-section-heading">${sysIcon('brain')}跨学科 · 观点与反驳</h3><div class="t-lenses">${list(analysis.lenses).map(position=>{const lens=thinkingLenses().find(entry=>entry.id===position.lensId),url=safeReference(lens?.sourceUrl);return `<article class="t-lens"><div class="t-lens-header">${sysIcon(position.lensId)}<div><h3>${e(lens?.name||position.lensId)}</h3><small>${e(lens?.family||'分析视角')}</small></div></div><div class="t-position"><strong>${ai?'观点 / 假说':'由此追问'}</strong>${e(position.claim)}</div><div class="t-position counter"><strong>最强反驳 / 盲点</strong>${e(position.counterargument)}</div><div class="t-position test"><strong>如何检验</strong>${e(position.test)}</div>${sourceReferences(position.sourceIds)}${url?`<p class="t-source-note"><a class="t-source" href="${e(url)}" target="_blank" rel="noopener noreferrer">学说参考 ↗</a> · 仅说明思考方法，不是本议题的事实证据。</p>`:''}</article>`}).join('')}</div></div><section class="t-section"><h3 class="t-section-heading">${sysIcon('systems')}追问因果 · 从发生到机制</h3><p class="g-form-help">因果链需要机制、时序与反例。相关性只提供线索；同时保留替代解释。</p>${list(analysis.causes).map(cause=>`<article class="t-cause"><div class="t-cause-block"><small>可能原因</small>${e(cause.cause)}</div><div class="t-cause-arrow" aria-hidden="true">→</div><div class="t-cause-block"><small>观察结果</small>${e(cause.effect)}</div><div class="t-cause-notes"><p><strong>中间机制：</strong>${e(cause.mechanism)}</p><p><strong>替代解释：</strong>${e(cause.alternative)}</p><p><strong>区分检验：</strong>${e(cause.test)}</p></div></article>`).join('')||'<div class="hint">暂无因果链，请补充发生顺序、约束和可观察的结果。</div>'}</section><section class="t-section"><h3 class="t-section-heading">${sysIcon('critical')}思想碰撞 · 不回避分歧</h3>${list(analysis.disagreements).map(debate=>`<article class="t-debate"><div class="t-debate-side"><strong>命题 / 一个立场</strong><p>${e(debate.thesis)}</p></div><div class="t-debate-side"><strong>反命题 / 最强挑战</strong><p>${e(debate.antithesis)}</p></div><div class="t-debate-test"><strong>让证据裁决：</strong>${e(debate.test)}</div></article>`).join('')||'<div class="hint">暂无明确分歧。可在假设中加入相反立场，再重新生成提纲。</div>'}</section><section class="panel pad t-section"><h3 class="t-section-heading">${sysIcon('target')}尚不知道的事</h3><ul class="t-unknown">${list(analysis.unknowns).map(unknown=>`<li>${e(unknown)}</li>`).join('')}</ul></section><section class="t-section"><h3 class="t-section-heading">${sysIcon('experiment')}从争论，走向下一次验证</h3>${list(analysis.actions).map((action,index)=>`<article class="t-action-card"><h3>${e(action.title)}</h3><p>${e(action.reason)}</p><p><strong>观察指标：</strong>${e(action.metric)}</p><button class="button small" data-growth-action="action-experiment" data-id="${e(item.id)}" data-index="${index}">${sysIcon('experiment')}转成策略实验</button></article>`).join('')}</section>${list(item.aiHistory).length?`<details class="panel pad t-section"><summary class="field-label" style="cursor:pointer">历史模型分析 · ${item.aiHistory.length} 条（修改输入后保留）</summary>${list(item.aiHistory).map(entry=>`<details class="details"><summary>${e(formatDate(entry.generatedAt||entry.createdAt||entry.archivedAt,true))} · 输入版本 ${e(entry.caseRevision||'未知')} · 历史快照</summary><pre class="file-content">${e(JSON.stringify(entry,null,2))}</pre></details>`).join('')}</details>`:''}`}
const reflectionFields=[['claim','我的论点','我目前主张什么？哪些事实支持它？'],['counterargument','最强反方论点','替对立观点作最有力的辩护，不把反方简化成稻草人。'],['causalExplanation','因果机制假说','从原因到结果，中间经过哪些环节？'],['alternative','替代原因与解释','还有什么原因能产生同样现象？是否存在共同原因？'],['test','能区分观点的检验','如果哪种证据出现，我会改变看法？怎样低成本观察？'],['conclusion','暂定结论与不确定性','当前倾向什么判断？哪些边界仍然未知？']];
function reflectionBody(record){return reflectionFields.map(([key,label])=>`<div class="t-position ${key==='counterargument'?'counter':key==='test'?'test':''}"><strong>${e(label)}</strong>${e(record[key])}</div>`).join('')}
function thinkingReflections(item){const records=list(item.reflections);return `<section class="panel pad t-section"><div class="goal-head"><div><h3 class="t-section-heading">${sysIcon('expression')}我的推演 · 亲自参与交锋</h3><p class="g-form-help">写出自己的论点与最强反方，把学科提纲用于实际推演。每一轮都保留，后续模型可据此继续质疑。</p></div></div><button class="button small" data-growth-action="reflect-case" data-id="${e(item.id)}">${sysIcon('evidence')}${records.length?'记录下一轮推演':'记录我的推演'}</button>${records.length?`<div class="meta" style="margin-top:17px">最近一轮 · ${e(formatDate(records[0].createdAt,true))}</div>${reflectionBody(records[0])}${records.length>1?`<details class="details"><summary>查看过去 ${records.length-1} 轮推演</summary>${records.slice(1).map(record=>`<details class="details"><summary>${e(formatDate(record.createdAt,true))}</summary>${reflectionBody(record)}</details>`).join('')}</details>`:''}`:'<p class="g-nonempty-note">尚无手动推演记录。无需接入模型也能完成分析与验证闭环。</p>'}</section>`}
function openThinkingReflection(item){openModal('记录我的推演','让不同立场正面交锋。认真处理反证，不必强行得出一致结论。',`<form id="thinking-reflect-form" data-id="${e(item.id)}" data-revision="${e(item.revision)}"><div class="hint" style="margin-bottom:16px"><strong>${e(item.title)}</strong><p>${e(item.question)}</p></div><div class="form-grid">${reflectionFields.map(([key,label,placeholder])=>`<div class="field full"><label for="reflect-${key}">${e(label)}</label><textarea id="reflect-${key}" name="${key}" required maxlength="4000" placeholder="${e(placeholder)}"></textarea></div>`).join('')}</div><p class="g-form-help" style="margin-top:16px">保存后保留历史轮次，旧模型分析归入历史。新推演会进入下一次模型预览。</p>${modalButtons('保存本轮推演')}</form>`,true)}
function openThinkingCase(item=null){const picked=item?.lensIds||[],types=[['self','自己'],['person','人'],['event','事情'],['object','事物'],['decision','决策']];openModal(item?'补充议题与事实':'开启一场多学科头脑风暴','明确问题，把事实与假设分开。选择 3–8 个视角；尽量让不同传统与学科彼此挑战。',`<form id="thinking-case-form" data-id="${e(item?.id||'')}" data-revision="${e(item?.revision||'')}"><div class="form-grid"><div class="field full"><label for="thinking-title">议题标题</label><input id="thinking-title" name="title" maxlength="300" required value="${e(item?.title||'')}" placeholder="例如：为什么学习了很多，却迟迟没有公开输出？"></div><div class="field"><label for="thinking-subject">分析对象</label><select id="thinking-subject" name="subjectType">${types.map(([id,label])=>`<option value="${id}" ${(item?.subjectType||'self')===id?'selected':''}>${label}</option>`).join('')}</select></div><div class="field full"><label for="thinking-context">情境与边界（选填）</label><textarea id="thinking-context" name="context" maxlength="4000" placeholder="涉及谁、何时发生、有哪些限制？">${e(item?.context||'')}</textarea></div><div class="field full"><label for="thinking-facts">已观察到的事实</label><textarea id="thinking-facts" name="facts" required maxlength="4000" placeholder="逐项记录具体事件、时间、行为和可核查结果；未知之处写明未知。">${e(item?.facts||'')}</textarea></div><div class="field full"><label for="thinking-assumptions">当前假设与相反解释（选填）</label><textarea id="thinking-assumptions" name="assumptions" maxlength="4000" placeholder="我认为原因是…；另一种可能是…；哪些只是主观推测？">${e(item?.assumptions||'')}</textarea></div><div class="field full"><label for="thinking-question">这次最想弄清的问题</label><textarea id="thinking-question" name="question" required maxlength="2000" placeholder="哪一个判断会影响我的行动？什么证据会改变我的看法？">${e(item?.question||'')}</textarea></div></div><fieldset class="g-fieldset form-section"><legend>选择思考视角（3–8 个）</legend><div class="t-lens-picker">${thinkingLenses().map(lens=>`<div class="t-lens-check"><input type="checkbox" name="lensIds" id="lens-${e(lens.id)}" value="${e(lens.id)}" ${picked.includes(lens.id)?'checked':''}><label for="lens-${e(lens.id)}">${sysIcon(lens.id)}<strong>${e(lens.name)}</strong><small>${e(lens.family)}</small></label></div>`).join('')}</div><p class="g-form-help" id="lens-count" style="margin-top:10px" aria-live="polite">已选 ${picked.length} 个。可组合经济学、军事战略与东西方哲学等视角。</p></fieldset><div class="field form-section"><label for="thinking-sources">引用自己的记录（选填，最多 12 条）</label>${sourcePicker('thinking-sources',item?.sourceIds||[])}</div>${item?'<div class="hint" style="margin-top:15px">保存后会根据新输入重建本地思考提纲，已有模型分析保留到历史。再次模型分析前需要重新预览。</div>':''}${modalButtons(item?'保存并重建提纲':'保存议题并生成提纲')}</form>`,true)}
function openExperiment(values={}){const future=new Date(Date.now()+7*86400000),dimension=values.dimension||growthDimensions()[0]?.id||'',caseItem=thinkingCaseById(values.caseId);openModal('设计一个成长实验','把观点当作假说。先写出基线、目标与复盘日期，再用一个真实行动收集证据。',`<form id="growth-experiment-form"><input type="hidden" name="caseId" value="${e(caseItem?.id||'')}">${caseItem?`<div class="hint" style="margin-bottom:15px">来自思辨议题：${e(caseItem.title)}</div>`:''}<div class="form-grid"><div class="field full"><label for="experiment-title">实验名称</label><input id="experiment-title" name="title" maxlength="300" required value="${e(values.title||'')}" placeholder="例如：每天先做 20 分钟输出，再阅读"></div><div class="field"><label for="experiment-dimension">主要练习维度</label><select id="experiment-dimension" name="dimension">${growthDimensions().map(item=>`<option value="${e(item.id)}" ${dimension===item.id?'selected':''}>${e(item.name)}</option>`).join('')}</select></div><div class="field"><label for="experiment-minutes">行动投入（分钟）</label><input id="experiment-minutes" type="number" name="minutes" min="1" max="1440" required value="${e(values.minutes||25)}"></div><div class="field full"><label for="experiment-hypothesis">可被推翻的假说</label><textarea id="experiment-hypothesis" name="hypothesis" required maxlength="4000" placeholder="如果做出什么改变，什么结果将发生？为什么？">${e(values.hypothesis||'')}</textarea></div><div class="field full"><label for="experiment-intervention">具体干预 / 行动</label><textarea id="experiment-intervention" name="intervention" required maxlength="4000" placeholder="描述这次要改变的一个行为，尽量控制其他条件。">${e(values.intervention||'')}</textarea></div><div class="field full"><label for="experiment-metric">衡量指标与记录方法</label><input id="experiment-metric" name="metric" required maxlength="2000" value="${e(values.metric||'')}" placeholder="例如：每周公开输出数量，记录实际链接与反馈"></div><div class="field"><label for="experiment-baseline">实验前基线</label><textarea id="experiment-baseline" name="baseline" required maxlength="2000" placeholder="目前实际是什么水平？">${e(values.baseline||'')}</textarea></div><div class="field"><label for="experiment-target">目标 / 判断阈值</label><textarea id="experiment-target" name="target" required maxlength="2000" placeholder="达到什么结果视为支持；什么结果反证假说？">${e(values.target||'')}</textarea></div><div class="field full"><label for="experiment-review-at">计划复盘时间</label><input id="experiment-review-at" name="reviewAt" type="datetime-local" required value="${e(dateInput(future))}"></div></div>${modalButtons('保存实验计划')}</form>`,true)}
function openExperimentReview(experiment){const task=tasks().find(item=>item.id===experiment.taskId);if(!task||task.status!=='已完成'||!String(task.evidence||'').trim()){notify('请先完成关联行动并留下证据，再复盘实验。','error');return}openModal('实验复盘 · 让结果修正判断','反证与没有结论都值得记录。只有证据暂时支持假说，才可选择保留策略。',`<div class="g-exp-measure"><b>${e(experiment.title)}</b><div>假说：${e(experiment.hypothesis)}</div><div>指标：${e(experiment.metric)}</div><div>基线：${e(experiment.baseline)}</div><div>目标：${e(experiment.target)}</div></div><div class="hint" style="margin-top:13px;white-space:pre-wrap"><strong>已完成行动的证据</strong><br>${e(task.evidence)}</div><form id="growth-experiment-review-form" data-id="${e(experiment.id)}" data-revision="${e(experiment.revision)}"><div class="form-grid form-section"><div class="field"><label for="experiment-outcome">结果对假说的支持程度</label><select id="experiment-outcome" name="outcome"><option value="inconclusive">证据不足，暂无结论</option><option value="supported">结果暂时支持假说</option><option value="refuted">结果反证了假说</option></select></div><div class="field"><label for="experiment-decision">下一轮策略</label><select id="experiment-decision" name="decision"><option value="adjust">调整方法</option><option value="stop">停止此策略</option><option value="keep" disabled>保留策略（需要结果支持）</option></select></div><div class="field full"><label for="experiment-observation">实际观察与指标结果</label><textarea id="experiment-observation" name="observation" required maxlength="4000" placeholder="对照基线和目标填写实际结果，包含异常与相反证据。"></textarea></div><div class="field full"><label for="experiment-lesson">学到什么 / 原判断哪里有偏差</label><textarea id="experiment-lesson" name="lesson" required maxlength="4000" placeholder="哪些机制得到支持？哪些仍无法区分？"></textarea></div><div class="field full"><label for="experiment-adjustment">下一轮的具体策略调整</label><textarea id="experiment-adjustment" name="adjustment" required maxlength="4000" placeholder="以后继续、改变或停止什么？在什么条件下重新考虑？"></textarea></div></div>${modalButtons('保存复盘与策略记忆')}</form>`,true)}
async function previewThinkingAi(item,button){if(!state.settings?.ai?.enabled||!state.settings.ai.baseUrl||!state.settings.ai.model){openModal('配置模型后，再开启辅助思辨','本地思考提纲已可直接使用。接入模型后，每次发送仍需先查看完整预览。',`<div class="hint">在「连接与运行」填写 API 地址与模型，并在服务端配置密钥。这里不会自动发送个人记录。</div><div class="modal-actions"><button class="button" data-close-modal>继续本地思考</button><button class="button primary" data-growth-action="configure-ai">前往模型配置</button></div>`);return}await perform('thinking-preview-'+item.id,button,async()=>{const preview=await api('/api/thinking/cases/'+encodeURIComponent(item.id)+'/ai/preview',{method:'POST',body:JSON.stringify({revision:item.revision})});openModal('确认本次模型思辨','批准后才会发送以下完整数据。模型会模拟多个视角；其输出仍需要证据检验。',`<div class="hint"><div><strong>目的地：</strong><span class="path">${e(preview.destination)}</span></div><div><strong>模型：</strong>${e(preview.model)}</div><div>预览有效至 ${e(formatDate(preview.expiresAt,true))}</div></div><details class="preview-file" open><summary>实际发送的完整内容</summary><pre class="file-content">${e(JSON.stringify(preview.payload,null,2))}</pre></details><form id="thinking-ai-run-form" data-id="${e(item.id)}" data-revision="${e(item.revision)}" data-preview-id="${e(preview.previewId)}">${modalButtons('批准发送并进行多视角分析','暂不发送')}</form>`,true)})}
document.addEventListener('click',async event=>{
  const button=event.target.closest('button');if(!button||button.disabled||!button.dataset.growthAction)return;
  const action=button.dataset.growthAction,id=button.dataset.id,item=thinkingCaseById(id),experiment=experimentById(id);
  switch(action){
    case 'assessment':openAssessment();break;
    case 'assessment-history':$('#assessment-history')?.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'scroll-experiments':$('#growth-experiments')?.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'new-experiment':openExperiment();break;
    case 'dimension-experiment':{const dimension=growthDimensions().find(entry=>entry.id===button.dataset.dimension);openExperiment({dimension:dimension?.id,intervention:dimension?.practice||''});break}
    case 'new-case':openThinkingCase();break;
    case 'edit-case':if(item)openThinkingCase(item);break;
    case 'reflect-case':if(item)openThinkingReflection(item);break;
    case 'select-case':selectedThinkingCase=id;render();$('#thinking-detail')?.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'open-case':selectedThinkingCase=id;navigate('thinking');break;
    case 'case-experiment':if(item)openExperiment({caseId:item.id});break;
    case 'action-experiment':{const suggestion=list(item?.analysis?.actions)[Number(button.dataset.index)];if(suggestion)openExperiment({caseId:item.id,title:suggestion.title,intervention:suggestion.title,hypothesis:suggestion.reason,metric:suggestion.metric,dimension:suggestion.dimension});break}
    case 'start-experiment':if(experiment)await mutate('/api/growth/experiments/'+encodeURIComponent(id)+'/start',{revision:experiment.revision},button,'实验已启动，关联行动已创建。完成后留下结果证据。');break;
    case 'review-experiment':if(experiment)openExperimentReview(experiment);break;
    case 'next-experiment':if(experiment){const last=list(experiment.reviews).at(-1);openExperiment({...experiment,title:'下一轮：'+experiment.title,intervention:last?.adjustment||experiment.intervention,baseline:'',target:experiment.target})}break;
    case 'ai-preview':if(item)await previewThinkingAi(item,button);break;
    case 'configure-ai':closeModal();navigate('connections');$('#ai-base')?.focus();break;
  }
});
document.addEventListener('change',event=>{if(event.target.name==='lensIds'&&$('#lens-count'))$('#lens-count').textContent=`已选 ${$$('[name="lensIds"]:checked',$('#thinking-case-form')).length} 个视角；需选择 3–8 个。`;if(event.target.id==='experiment-outcome'){const supported=event.target.value==='supported',keep=$('#experiment-decision option[value="keep"]');keep.disabled=!supported;if(!supported&&$('#experiment-decision').value==='keep')$('#experiment-decision').value='adjust'}if(event.target.matches('[data-assessment-score]')){const row=event.target.closest('.g-assessment-row');$('[data-assessment-note]',row).required=Boolean(event.target.value)}});
document.addEventListener('submit',async event=>{
  const form=event.target,ids=['growth-assessment-form','thinking-case-form','thinking-reflect-form','growth-experiment-form','growth-experiment-review-form','thinking-ai-run-form'];if(!(form instanceof HTMLFormElement)||!ids.includes(form.id))return;event.preventDefault();const values=Object.fromEntries(new FormData(form).entries()),button=event.submitter||form.querySelector('[type=submit]');
  if(form.id==='growth-assessment-form'){
    const ratings=$$('.g-assessment-row',form).filter(row=>$('[data-assessment-score]',row).value).map(row=>({dimension:row.dataset.dimension,score:Number($('[data-assessment-score]',row).value),note:$('[data-assessment-note]',row).value.trim(),sourceIds:selectedSources($('.g-source-select',row)||document.createElement('select'))}));
    if(!ratings.length){modalError('至少选择一个有依据的维度；其余维度可以留空。');return}if(ratings.some(rating=>!rating.note)){modalError('请为每个已评分的维度填写具体依据。');return}if(ratings.some(rating=>rating.sourceIds.length>12)){modalError('每个维度最多引用 12 条记录。');return}
    const result=await submitModal(form,'/api/growth/assessments',{context:values.context.trim(),ratings},'新的能力画像已保存。旧记录与依据保留在自评历史。','POST',button);if(result)navigate('growth');
  }else if(form.id==='thinking-case-form'){
    const lensIds=$$('[name="lensIds"]:checked',form).map(input=>input.value),sourceIds=selectedSources($('#thinking-sources')||document.createElement('select'));if(lensIds.length<3||lensIds.length>8){modalError('请选择 3–8 个思考视角。');return}if(sourceIds.length>12){modalError('每个议题最多引用 12 条记录。');return}const data={title:values.title.trim(),subjectType:values.subjectType,context:values.context.trim(),facts:values.facts.trim(),assumptions:values.assumptions.trim(),question:values.question.trim(),lensIds,sourceIds};if(form.dataset.id)data.revision=Number(form.dataset.revision);
    const result=await submitModal(form,'/api/thinking/cases'+(form.dataset.id?'/'+encodeURIComponent(form.dataset.id):''),data,'议题已保存。本地思考提纲已生成，可继续追问或预览模型分析。',form.dataset.id?'PATCH':'POST',button);if(result?.thinkingCase){selectedThinkingCase=result.thinkingCase.id;navigate('thinking')}
  }else if(form.id==='thinking-reflect-form'){
    const result=await submitModal(form,'/api/thinking/cases/'+encodeURIComponent(form.dataset.id)+'/reflect',{...values,revision:Number(form.dataset.revision)},'本轮推演已保存。接下来可以设计检验，或继续寻找反证。','POST',button);if(result?.thinkingCase){selectedThinkingCase=result.thinkingCase.id;navigate('thinking')}
  }else if(form.id==='growth-experiment-form'){
    const reviewAt=realDate(values.reviewAt);if(!reviewAt){modalError('请选择有效的复盘时间。');return}const data={...values,minutes:Number(values.minutes),reviewAt:reviewAt.toISOString()};if(!data.caseId)delete data.caseId;const result=await submitModal(form,'/api/growth/experiments',data,'实验计划已保存。核对后启动，系统会创建真实行动。','POST',button);if(result){navigate('growth');$('#growth-experiments')?.scrollIntoView({block:'start',behavior:'smooth'})}
  }else if(form.id==='growth-experiment-review-form'){
    if(values.outcome!=='supported'&&values.decision==='keep'){modalError('证据不足或反证假说时，请选择调整或停止策略。');return}const result=await submitModal(form,'/api/growth/experiments/'+encodeURIComponent(form.dataset.id)+'/review',{...values,revision:Number(form.dataset.revision)},'实验复盘已保存，发现与调整进入策略记忆。','POST',button);if(result){navigate('growth');$('#growth-experiments')?.scrollIntoView({block:'start',behavior:'smooth'})}
  }else if(form.id==='thinking-ai-run-form'){
    const result=await submitModal(form,'/api/thinking/cases/'+encodeURIComponent(form.dataset.id)+'/ai/run',{revision:Number(form.dataset.revision),previewId:form.dataset.previewId,approved:true},'模型辅助分析已保存。请核对事实、反驳与检验方法。','POST',button);if(result?.thinkingCase){selectedThinkingCase=result.thinkingCase.id;navigate('thinking')}
  }
});
refresh();
</script></body></html>
