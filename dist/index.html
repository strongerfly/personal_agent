<script>
'use strict';
const $=(selector,root=document)=>root.querySelector(selector);
const $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const e=escapeHtml,list=value=>Array.isArray(value)?value:[];
let state={tasks:[],petitions:[],reading:[],digests:[],goals:[],checkins:[],runs:[],aiAnalyses:[],automation:{},settings:{},integrations:{}};
let page=['today','actions','learning','review','connections'].includes(location.hash.slice(1))?location.hash.slice(1):'today';
let morning={tasks:[],reason:''},taskFilter='全部',readingFilter='全部',readingQuery='',connected=false,refreshing=false,modalReturnFocus=null,modalBusy=false;
const pending=new Set(),pageNames={today:'今日',actions:'目标与行动',learning:'学习与记忆',review:'史馆复盘',connections:'连接与运行'};
const normalizeStatus=value=>({todo:'待确认',doing:'执行中',done:'已完成'}[value]||value);
const tasks=()=>list(state.tasks).filter(item=>!item.isDemo).map(item=>({...item,status:normalizeStatus(item.status)}));
const activeTasks=()=>tasks().filter(item=>item.status!=='已完成');
const realDate=value=>{if(!value)return null;const date=new Date(value);return Number.isNaN(date.getTime())?null:date};
const formatDate=(value,time=false)=>{const date=realDate(value);return date?date.toLocaleString('zh-CN',time?{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}:{month:'numeric',day:'numeric'}):'未设置'};
const sameDay=(value,date=new Date())=>{const item=realDate(value);return item&&item.getFullYear()===date.getFullYear()&&item.getMonth()===date.getMonth()&&item.getDate()===date.getDate()};
const dateInput=value=>{const date=realDate(value);return date?new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16):''};
const newest=items=>list(items).slice().sort((a,b)=>(realDate(b.createdAt)?.getTime()||0)-(realDate(a.createdAt)?.getTime()||0));
const goalTitle=id=>list(state.goals).find(goal=>goal.id===id)?.title||'';
function notify(message,type='success'){const node=$('#notice');node.setAttribute('role',type==='error'?'alert':'status');node.innerHTML=message?`<div class="notice ${type==='error'?'error':''}"><span>${e(message)}</span><button aria-label="关闭提示" data-dismiss>×</button></div>`:'';if(message&&type==='error')node.scrollIntoView({block:'nearest',behavior:'smooth'})}
function modalError(error){const node=$('#modal-error');if(node){node.innerHTML=`<div class="notice error" role="alert">${e(error.message||error)}</div>`;node.scrollIntoView({block:'nearest'})}else notify(error.message||String(error),'error')}
async function api(url,options={}){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),120000);try{const response=await fetch(url,{...options,signal:controller.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!(response.headers.get('content-type')||'').includes('json'))throw new Error('服务没有返回 JSON。请通过项目服务打开此页面。');const data=await response.json();if(!response.ok)throw new Error(typeof data.error==='string'?data.error:data.error?.message||data.message||`请求失败（${response.status}）`);return data}catch(error){if(error.name==='AbortError')throw new Error('请求超时。请查看运行记录后再尝试。');if(error instanceof TypeError)throw new Error('无法连接本地服务。请确认服务已启动，然后刷新。');throw error}finally{clearTimeout(timeout)}}
async function perform(key,button,work,inModal=false){if(pending.has(key))return null;pending.add(key);const original=button?.textContent;if(button){button.disabled=true;button.textContent='处理中…'}if(inModal)modalBusy=true;try{return await work()}catch(error){if(inModal)modalError(error);else notify(error.message||String(error),'error');return null}finally{pending.delete(key);if(button?.isConnected){button.disabled=false;button.textContent=original}if(inModal)modalBusy=false}}
async function refresh(){if(refreshing)return false;refreshing=true;$('#content').setAttribute('aria-busy','true');try{const result=await api('/api/state');state={...state,...(result.state||result)};connected=true;$('#server-status').innerHTML='<span class="dot"></span> 本地服务已连接';$('#server-status').style.color='var(--jade)';try{morning=await api('/api/morning')}catch(error){morning={tasks:[],reason:error.message};}render();$('#save-status').textContent=`本地数据 · ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} 更新`;return true}catch(error){connected=false;$('#server-status').innerHTML='<span class="dot"></span> 本地服务未连接';$('#server-status').style.color='var(--red)';notify(error.message,'error');if(!$('#content').querySelector('.page-heading'))$('#content').innerHTML=`<div class="panel pad">${empty('连接服务后继续','请启动项目服务，再通过服务提供的地址打开此页面。','重新连接','retry')}</div>`;return false}finally{refreshing=false;$('#content').setAttribute('aria-busy','false')}}
function resultNotice(message,result,refreshed=true){const issues=[...list(result?.warnings),...list(result?.errors).map(item=>`记录 ${Number(item.index||0)+1}：${item.message||item}`),...list(result?.conflicts).map(item=>`${item.path}：${item.reason}`)];if(typeof result?.imported==='number')message=`导入 ${result.imported} 条，更新 ${result.updated||0} 条，跳过 ${result.skipped||0} 条。`;if(Array.isArray(result?.written))message=`已写入 ${result.written.length} 个文件，${list(result.unchanged).length} 个文件无需修改。`;if(issues.length)message+='\n'+issues.slice(0,8).map(item=>typeof item==='string'?item:JSON.stringify(item)).join('\n')+(issues.length>8?`\n另有 ${issues.length-8} 项，请检查输入内容。`:'');if(!refreshed)message+=' 数据刷新失败，请稍后刷新。';notify(message,issues.length||!refreshed?'error':'success')}
async function mutate(url,data,button,message,method='POST'){return perform(url,button,async()=>{const result=await api(url,{method,body:JSON.stringify(data)});resultNotice(message,result,await refresh());return result})}
function empty(title,description='',action='',command=''){return `<div class="empty"><div class="empty-mark" aria-hidden="true">○</div><strong>${e(title)}</strong>${e(description)}${action?`<br><button class="button small" data-action="${e(command)}">${e(action)}</button>`:''}</div>`}
function heading(eyebrow,title,description,button=''){return `<div class="page-heading"><div><div class="eyebrow">${e(eyebrow)}</div><h1>${e(title)}</h1><p class="subtitle">${e(description)}</p></div>${button}</div>`}
function chip(text,tone=''){return `<span class="chip ${e(tone)}">${e(text)}</span>`}
function taskAction(task){if(task.status==='已完成')return '';const start=['待确认','已顺延'].includes(task.status);return `<button class="button small ${start?'':'primary'}" data-action="${start?'start-task':'complete-task'}" data-id="${e(task.id)}">${start?'开始行动':'记录完成'}</button>`}
function taskRow(task){const done=task.status==='已完成';return `<div class="row"><span class="status-circle ${done?'done':''}" aria-hidden="true">${done?'✓':''}</span><div class="row-main"><div class="row-title ${done?'completed':''}">${e(task.title)}</div><div class="meta">${chip(task.status,done?'jade':task.status==='待确认'?'orange':'')}${task.goalId?`<span>${e(goalTitle(task.goalId))}</span>`:''}${task.dueAt?`<span>${e(formatDate(task.dueAt,true))}</span>`:''}${task.minutes?`<span>${e(task.minutes)} 分钟</span>`:''}${task.priority==='高'?chip('优先','orange'):''}</div>${done&&task.evidence?`<div class="row-note">完成证据：${e(task.evidence)}</div>`:''}</div><div class="actions">${taskAction(task)}<button class="button text small" data-action="edit-task" data-id="${e(task.id)}" aria-label="编辑 ${e(task.title)}">编辑</button></div></div>`}
function render(){if(!connected)return;$('#breadcrumb').textContent=`御前 / ${pageNames[page]}`;$$('.nav button').forEach(button=>{const active=button.dataset.page===page;button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});$('#content').innerHTML=({today:renderToday,actions:renderActions,learning:renderLearning,review:renderReview,connections:renderConnections})[page]();document.title=`${pageNames[page]} · 个人朝廷`}

function reviewDue(item){const date=realDate(item.nextReviewAt);return date&&date.getTime()<=Date.now()}

y" type="submit">记入史馆</button></div></form>${checkin?`<div class="divider"></div><div class="section-caption">今天最近的记录 · ${e(formatDate(checkin.createdAt,true))}</div><p class="row-note">${e(checkin.note)}</p>`:''}</div></section><section class="panel pad"><div class="eyebrow">学而时习</div><h2 style="font-size:20px">让阅读，走向一次行动。</h2><p class="subtitle">导入读书笔记，试着不看原文回忆，再把一个想法变成练习。</p><button class="button text" style="margin-top:13px" data-go="learning">打开学习台 →</button></section></div></div>`}
function renderActions(){const visible=newest(tasks()).filter(item=>taskFilter==='全部'||item.status===taskFilter),goals=list(state.goals);return heading('DIRECTION & ACTION','目标有方向，行动有回响。','用一个明确的目标串起行动，以可观察的结果作为完成证据。','<button class="button primary" data-action="new-task">＋ 添加行动</button>')+`<div class="grid cols"><section class="panel"><div class="panel-head"><div><h2>行动清单</h2><p class="panel-desc">${tasks().length} 项行动 · ${tasks().filter(item=>item.status==='已完成').length} 项已完成</p></div></div><div class="panel-body"><div class="filters" role="group" aria-label="按行动状态筛选">${['全部','待确认','执行中','已完成','已顺延'].map(value=>`<button class="filter ${taskFilter===value?'active':''}" data-task-filter="${value}" aria-pressed="${taskFilter===value}">${value}</button>`).join('')}</div>${visible.length?visible.map(taskRow).join(''):empty(taskFilter==='全部'?'从一个小行动开始':'这里暂时没有行动','写清楚要做什么，完成时留下结果。','添加行动','new-task')}</div></section><div class="stack"><section class="panel"><div class="panel-head"><div><h2>我的目标</h2><p class="panel-desc">为什么做，比做多少更重要</p></div><button class="button text" data-action="new-goal">＋ 新目标</button></div>${goals.length?goals.map(goal=>{const linked=tasks().filter(item=>item.goalId===goal.id),completed=linked.filter(item=>item.status==='已完成').length,percent=linked.length?Math.round(completed/linked.length*100):0;return `<article class="goal-card"><div class="goal-head"><h3 class="goal-title">${e(goal.title)}</h3>${chip(goal.status==='completed'?'已达成':'进行中',goal.status==='completed'?'jade':'')}</div><p class="goal-why">${e(goal.why||'每一个小行动，都是靠近目标的一步。')}</p><div class="progress" aria-label="关联行动完成率 ${percent}%"><span style="width:${percent}%"></span></div><div class="goal-meta"><span>${completed} / ${linked.length} 项关联行动</span><span>${goal.targetDate?'目标 '+e(formatDate(goal.targetDate)):'未设置目标日期'}</span></div><div class="actions" style="margin-top:15px"><button class="button small" data-action="goal-task" data-id="${e(goal.id)}">＋ 关联行动</button><button class="button text small" data-action="toggle-goal" data-id="${e(goal.id)}">${goal.status==='completed'?'重新开启':'标记达成'}</button></div></article>`}).join(''):empty('给行动一个方向','比如：完成一次公开分享，或学会一项新技能。','写下目标','new-goal')}</section><div class="hint">行动流转：待确认 → 执行中 → 已完成。完成时记下作品、链接、观察或反馈，让复盘有据可循。</div></div></div>`}
function readingItems(){const query=readingQuery.trim().toLowerCase();return newest(state.reading).filter(item=>(readingFilter!=='待复习'||reviewDue(item))&&(!query||[item.title,item.author,item.note,item.quote,...list(item.tags)].join(' ').toLowerCase().includes(query)))}

function integrationStatus(key){const value=state.integrations?.[key]||{};if(typeof value==='string')return value;if(value.message)return value.message;if(key==='obsidian'){if(value.error)return value.error;if(value.readingReady)return '本地阅读目录可用 · 云端同步未验证';return state.settings?.vaultPath?'已设置路径 · 等待读书笔记':'使用默认本地目录 · 阅读来源待配置'}if(value.ready)return '配置就绪 · 尚未验证服务';if(key==='ai'&&value.enabled&&!value.keyConfigured)return '已启用 · 等待服务端密钥';return '尚未配置'}
function hourOptions(value){return Array.from({length:24},(_,i)=>`<option value="${i}" ${Number(value)===i?'selected':''}>${String(i).padStart(2,'0')}:00</option>`).join('')}
function analysisBody(analysis){if(typeof analysis==='string')return markdown(analysis);return `<div class="markdown">${markdown(analysis?.summary||'暂无摘要')}${list(analysis?.actions).length?'<h3>可考虑的行动</h3>'+list(analysis.actions).slice(0,3).map(action=>`<p>· ${e(actionTitle(action))}</p>`).join(''):''}${list(analysis?.citations).length?'<h3>参考记录</h3>'+list(analysis.citations).map(item=>`<p>${e(typeof item==='string'?item:JSON.stringify(item))}</p>`).join(''):''}</div>`}
function renderConnections(){const settings=state.settings||{},ai=settings.ai||{},auto=state.automation||{},runs=newest(state.runs);return heading('TOOLS WITH BOUNDARIES','工具就位，节奏由你。','本地整理、笔记连接与可选的模型分析，都从清楚的配置开始。','<a class="button" href="/api/export" download>↓ 导出全部数据</a>')+`<div class="grid equal"><div class="stack"><section class="panel"><div class="panel-head"><div class="connection"><div class="connection-icon">山</div><div><h2>Obsidian 笔记库</h2><p class="panel-desc">${e(integrationStatus('obsidian'))}</p></div></div></div><div class="panel-body"><form id="vault-settings"><div class="field"><label for="vault-path">笔记库完整路径</label><input id="vault-path" name="vaultPath" value="${e(settings.vaultPath||'')}" placeholder="例如 D:\\Notes\\MyVault"><small>可以先保存路径。文件读取由运行此服务的电脑执行。</small></div><div class="field form-section"><label for="reading-folder">微信读书笔记文件夹</label><input id="reading-folder" name="readingFolder" value="${e(settings.readingFolder||'WeRead')}" placeholder="WeRead"><small>相对于笔记库的目录，用于读取已有 Markdown 笔记。</small></div><div class="form-actions"><button class="button" type="submit">保存路径</button></div></form><div class="divider"></div><div class="actions"><button class="button" data-action="obsidian-import">读取读书笔记</button><button class="button primary" data-action="obsidian-preview">预览整理结果</button></div><p class="panel-desc" style="margin-top:12px">先预览将要写入的完整文件内容，再批准导出。</p></div></section><section class="panel"><div class="panel-head"><div><h2>自动整理</h2><p class="panel-desc">运行时区：Asia/Shanghai（北京时间）</p></div></div><div class="panel-body"><form id="automation-form"><label class="checkbox-field"><input type="checkbox" name="enabled" ${auto.enabled?'checked':''}>启用定时整理</label><div class="form-grid form-section"><div class="field"><label for="daily-hour">每天日报时间</label><select id="daily-hour" name="dailyHour">${hourOptions(auto.dailyHour??21)}</select></div><div class="field"><label for="weekly-day">每周复盘日</label><select id="weekly-day" name="weeklyDay">${['周日','周一','周二','周三','周四','周五','周六'].map((day,i)=>`<option value="${i}" ${Number(auto.weeklyDay??0)===i?'selected':''}>${day}</option>`).join('')}</select></div><div class="field"><label for="weekly-hour">每周复盘时间</label><select id="weekly-hour" name="weeklyHour">${hourOptions(auto.weeklyHour??20)}</select></div><div class="field" style="align-content:end"><label class="checkbox-field"><input type="checkbox" name="autoImport" ${auto.autoImport?'checked':''}>整理前导入读书笔记</label></div></div><div class="form-actions"><button class="button" data-action="automation-tick" type="button">检查到期任务</button><button class="button primary" type="submit">保存自动整理</button></div></form><div class="hint" style="margin-top:15px">定时整理需要本地服务保持运行。写入笔记库和外部模型分析仍需单独批准。</div></div></section></div><div class="stack"><section class="panel"><div class="panel-head"><div class="connection"><div class="connection-icon">策</div><div><h2>可选模型分析</h2><p class="panel-desc">${e(integrationStatus('ai'))}</p></div></div></div><div class="panel-body"><form id="ai-settings"><label class="checkbox-field"><input type="checkbox" name="enabled" ${ai.enabled?'checked':''}>启用外部模型分析</label><div class="field form-section"><label for="ai-base">API 地址</label><input id="ai-base" name="baseUrl" type="url" value="${e(ai.baseUrl||'')}" placeholder="https://api.example.com/v1"><small>填写兼容服务的 API 地址，保存配置不会发起模型请求。</small></div><div class="field form-section"><label for="ai-model">模型名称</label><input id="ai-model" name="model" value="${e(ai.model||'')}" placeholder="填写服务支持的模型名称"></div><div class="hint" style="margin-top:15px">密钥仅通过服务端环境变量配置；此页面不会读取或显示密钥。每次发送前都会展示目的地和数据预览。</div><div class="form-actions"><button class="button" type="submit">保存模型配置</button></div></form><div class="divider"></div><form id="ai-question"><div class="field"><label for="analysis-question">想分析的问题</label><textarea id="analysis-question" name="question" required maxlength="2000" placeholder="例如：根据最近的行动与复盘，下周可以做哪一个调整？"></textarea></div><div class="form-actions"><button class="button primary" type="submit">预览将要发送的数据</button></div></form>${list(state.aiAnalyses).length?`<div class="divider"></div><div class="section-caption">最近的分析</div>${newest(state.aiAnalyses).slice(0,5).map(item=>`<details class="details"><summary>${e(item.question||'模型分析')} · ${e(formatDate(item.createdAt,true))}</summary>${analysisBody(item.analysis||item)}</details>`).join('')}`:''}</div></section><section class="panel"><div class="panel-head"><div><h2>运行记录</h2><p class="panel-desc">自动整理与手动检查的实际运行结果</p></div>${chip(runs.length+' 次')}</div><div class="panel-body">${runs.length?runs.slice(0,30).map(run=>`<div class="row"><div class="row-main"><div class="row-title">${e(run.type||'运行')}</div><div class="meta">${e(formatDate(run.createdAt,true))}</div>${run.error?`<div class="run-error">${e(typeof run.error==='string'?run.error:JSON.stringify(run.error))}</div>`:''}${list(run.warnings).length?`<div class="run-error">${list(run.warnings).map(warning=>e(typeof warning==='string'?warning:JSON.stringify(warning))).join('<br>')}</div>`:''}</div>${chip(run.status||'未知',['success','completed','succeeded','done'].includes(run.status)?'jade':['failed','error'].includes(run.status)?'red':'orange')}</div>`).join(''):empty('自动整理尚未运行','到期后自动整理，或点击「检查到期任务」查看执行结果。')}</div></section></div></div>`}
function openModal(title,description,content,wide=false){modalReturnFocus=document.activeElement;$('#modal').classList.toggle('wide',wide);$('#modal-content').innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${e(title)}</h2><p>${e(description)}</p></div><button class="modal-close" data-close-modal aria-label="关闭对话框">×</button></div><div id="modal-error"></div>${content}`;$('#modal-backdrop').hidden=false;$('.app').inert=true;document.body.style.overflow='hidden';requestAnimationFrame(()=>{const focus=$('input:not([type=hidden]),textarea,select,button:not([data-close-modal])',$('#modal'));(focus||$('#modal')).focus()})}
function closeModal(force=false){if(modalBusy&&!force)return;$('#modal-backdrop').hidden=true;$('#modal-content').innerHTML='';$('.app').inert=false;document.body.style.overflow='';if(modalReturnFocus?.isConnected)modalReturnFocus.focus();else $('.nav button.active')?.focus()}
function modalButtons(submit,cancel='取消'){return `<div class="modal-actions"><button class="button" type="button" data-close-modal>${e(cancel)}</button><button class="button primary" type="submit">${e(submit)}</button></div>`}
function goalOptions(selected=''){return '<option value="">暂不关联目标</option>'+list(state.goals).map(goal=>`<option value="${e(goal.id)}" ${goal.id===selected?'selected':''}>${e(goal.title)}${goal.status==='completed'?'（已达成）':''}</option>`).join('')}
function openTask(task=null,goalId=''){openModal(task?'编辑行动':'添加一个行动','描述一个可以完成、可以留下证据的具体结果。',`<form id="task-form" data-id="${e(task?.id||'')}"><div class="form-grid"><div class="field full"><label for="task-title">行动内容</label><input id="task-title" name="title" required maxlength="300" value="${e(task?.title||'')}" placeholder="例如：完成一页项目提案并收集反馈"></div><div class="field full"><label for="task-goal">关联目标</label><select id="task-goal" name="goalId">${goalOptions(task?.goalId||goalId)}</select></div><div class="field"><label for="task-due">计划完成时间</label><input id="task-due" type="datetime-local" name="dueAt" value="${e(dateInput(task?.dueAt))}"></div>${task?'':`<div class="field"><label for="task-priority">优先级</label><select id="task-priority" name="priority">${['高','中','低'].map(value=>`<option ${value==='中'?'selected':''}>${value}</option>`).join('')}</select></div><div class="field"><label for="task-dept">负责领域</label><select id="task-dept" name="dept">${['兵部','吏部','户部','礼部','刑部','工部'].map(value=>`<option>${value}</option>`).join('')}</select></div><div class="field"><label for="task-minutes">预计分钟数（选填）</label><input id="task-minutes" type="number" name="minutes" min="1" max="1440" placeholder="30"></div>`}</div>${modalButtons(task?'保存修改':'添加行动')}</form>`)}
function openCapture(){openModal('捕获一份奏折','先把想法放下来，再决定如何推进。',`<form id="capture-form"><div class="field"><label for="capture-title">标题</label><input id="capture-title" name="title" required maxlength="300" placeholder="一个念头，或一件待办…"></div><div class="field form-section"><label for="capture-note">补充说明（选填）</label><textarea id="capture-note" name="note" maxlength="10000" placeholder="相关背景、灵感或期待的结果"></textarea></div>${modalButtons('放入收件箱')}</form>`)}
function openGoal(){openModal('给下一段路一个方向','目标可以不大，但最好知道它为什么对你重要。',`<form id="goal-form"><div class="field"><label for="goal-title">目标</label><input id="goal-title" name="title" required maxlength="300" placeholder="例如：完成第一次公开分享"></div><div class="field form-section"><label for="goal-why">为什么想做（选填）</label><textarea id="goal-why" name="why" maxlength="2000" placeholder="它会给你带来什么改变？"></textarea></div><div class="field form-section"><label for="goal-target">目标日期（选填）</label><input id="goal-target" type="date" name="targetDate"></div>${modalButtons('保存目标')}</form>`)}
function openComplete(task){openModal('为这次完成，留一份证据',task.title,`<form id="complete-form" data-id="${e(task.id)}"><div class="field"><label for="complete-evidence">完成证据</label><textarea id="complete-evidence" name="evidence" required maxlength="4000" placeholder="写下产出、作品链接、具体观察或收到的反馈…"></textarea><small>这段记录会进入复盘，帮助你看到实际发生的改变。</small></div>${modalButtons('记录完成')}</form>`)}
function openReadingImport(){openModal('导入阅读笔记','支持 JSON、Markdown 和纯文本；文件在浏览器内读取后提交给本地服务。',`<form id="reading-import-form"><div class="form-grid"><div class="field"><label for="import-format">内容格式</label><select id="import-format" name="format"><option value="markdown">Markdown</option><option value="text">纯文本</option><option value="json">JSON</option></select></div><div class="field"><label for="import-title">默认标题（选填）</label><input id="import-title" name="title" maxlength="300" placeholder="书名或笔记标题"></div><div class="field full"><label for="import-file">选择文件（选填，最大 900 KB）</label><input id="import-file" type="file" accept=".md,.markdown,.txt,.json,text/plain,application/json"><small>也可以直接将文本粘贴到下面。</small></div><div class="field full"><label for="import-text">笔记内容</label><textarea id="import-text" name="text" required rows="10" style="min-height:230px" placeholder="# 书名&#10;作者：…&#10;&#10;最想记住的观点与自己的思考"></textarea><small>JSON 支持对象数组，字段可包含 title、author、note、quote、tags。</small></div></div>${modalButtons('导入并保存')}</form>`,true)}
function openReadingReview(item){openModal('合上书，先试着回忆',item.title||'阅读笔记',`<form id="reading-review-form" data-id="${e(item.id)}"><div class="hint">这段内容的核心观点是什么？它解释了什么问题？你能想到一个自己的例子吗？先用自己的话写一遍，再展开笔记核对。</div><div class="field form-section"><label for="recall-answer">我的回忆</label><textarea id="recall-answer" name="answer" required maxlength="4000" placeholder="不看原文，写下现在能回忆起来的内容…"></textarea></div><button class="button small" type="button" style="margin-top:12px" data-action="reveal-reading">写好了，核对原笔记</button><div id="recall-source" hidden><div class="divider"></div>${item.quote?`<blockquote class="quote">${e(item.quote)}</blockquote>`:''}<p class="reading-excerpt">${e(item.note||'暂无笔记正文')}</p></div><div class="modal-actions"><button class="button" type="submit" name="rating" value="again">忘记，再看一次</button><button class="button primary" type="submit" name="rating" value="good">记得</button></div></form>`)}
function openReadingTask(item){openModal('把所学，变成一次实践',item.title,`<form id="reading-task-form" data-id="${e(item.id)}"><div class="field"><label for="practice-title">准备做什么练习？</label><input id="practice-title" name="title" required maxlength="300" placeholder="例如：选一个工作场景，试用笔记中的方法"></div>${modalButtons('添加练习行动')}</form>`)}
async function previewObsidian(button){await perform('obsidian-preview',button,async()=>{const preview=await api('/api/obsidian/preview',{method:'POST',body:'{}'}),files=list(preview.files);openModal('确认将要写入的笔记','请逐个查看路径、状态和完整内容；批准后才会写入。',`<div class="hint"><strong>目标笔记库</strong><div class="path">${e(preview.vaultPath||state.settings.vaultPath||'')}</div>${preview.expiresAt?`<div>预览有效至 ${e(formatDate(preview.expiresAt,true))}</div>`:''}</div>${files.length?files.map(file=>`<details class="preview-file" open><summary>${e(file.path)} ${chip(file.status||'待写入')}</summary><pre class="file-content">${e(file.content)}</pre></details>`).join(''):empty('没有待写入的文件','先记录行动或生成复盘，再预览整理结果。')}<form id="obsidian-export-form" data-preview-id="${e(preview.previewId)}"><div class="modal-actions"><button class="button" type="button" data-close-modal>取消</button><button class="button primary" type="submit" ${files.length?'':'disabled'}>批准写入 ${files.length} 个文件</button></div></form>`,true)})}
function openAiPreview(question,preview){openModal('确认这次模型分析','批准后，下面展示的数据将发送到配置的服务。',`<div class="hint"><div><strong>目的地：</strong><span class="path">${e(preview.destination||state.settings.ai?.baseUrl||'未设置')}</span></div><div><strong>模型：</strong>${e(preview.model||state.settings.ai?.model||'未设置')}</div>${preview.expiresAt?`<div>预览有效至 ${e(formatDate(preview.expiresAt,true))}</div>`:''}</div><details class="preview-file" open><summary>实际将发送的数据与字段</summary><pre class="file-content">${e(JSON.stringify(preview.payload||preview,null,2))}</pre></details><form id="ai-run-form" data-preview-id="${e(preview.previewId)}"><input type="hidden" name="question" value="${e(question)}">${modalButtons('批准发送并分析','暂不发送')}</form>`,true)}
async function submitModal(form,url,data,message,method='POST',button=form.querySelector('[type=submit]')){return perform(url,button,async()=>{const result=await api(url,{method,body:JSON.stringify(data)});if(typeof result?.imported==='number'&&!result.imported&&!result.updated&&list(result.errors).length){modalError(list(result.errors).map(item=>`记录 ${Number(item.index||0)+1}：${item.message}`).join('\n'));return result}closeModal(true);resultNotice(message,result,await refresh());return result},true)}
document.addEventListener('click',async event=>{const button=event.target.closest('button,a');if(!button||button.disabled)return;if(button.matches('[data-dismiss]')){notify('');return}if(button.matches('[data-close-modal]')){closeModal();return}if(button.dataset.page){navigate(button.dataset.page);return}if(button.dataset.go){navigate(button.dataset.go);return}if(button.dataset.taskFilter){taskFilter=button.dataset.taskFilter;render();return}if(button.dataset.readingFilter){readingFilter=button.dataset.readingFilter;render();return}const action=button.dataset.action,id=button.dataset.id;if(!action)return;const task=tasks().find(item=>String(item.id)===id),reading=list(state.reading).find(item=>String(item.id)===id);switch(action){case 'retry':await refresh();break;case 'capture':openCapture();break;case 'new-task':openTask();break;case 'edit-task':if(task)openTask(task);break;case 'goal-task':openTask(null,id);break;case 'new-goal':openGoal();break;case 'complete-task':if(task)openComplete(task);break;case 'start-task':await mutate('/api/tasks/'+encodeURIComponent(id),{status:'执行中'},button,'行动已开始。完成时记得留下结果。','PATCH');break;case 'convert-petition':await mutate('/api/petitions/'+encodeURIComponent(id)+'/convert',{},button,'已转成待确认行动，可以在目标与行动中查看。');break;case 'toggle-goal':{const goal=list(state.goals).find(item=>String(item.id)===id);if(goal)await mutate('/api/goals/'+encodeURIComponent(id),{status:goal.status==='completed'?'active':'completed'},button,'目标状态已更新。','PATCH');break}case 'import-reading':openReadingImport();break;case 'review-reading':if(reading)openReadingReview(reading);break;case 'reading-task':if(reading)openReadingTask(reading);break;case 'reveal-reading':if(!$('#recall-answer').value.trim()){modalError('请先用自己的话写下回忆。');$('#recall-answer').focus();return}$('#recall-source').hidden=false;button.hidden=true;break;case 'daily-digest':case 'weekly-digest':{const result=await mutate('/api/organize/run',{period:action==='daily-digest'?'daily':'weekly'},button,'复盘已生成，可以展开阅读全文。');if(result&&page!=='review')navigate('review');break}case 'digest-action':await mutate('/api/digests/'+encodeURIComponent(id)+'/actions/'+button.dataset.index,{},button,'已加入行动清单。');break;case 'obsidian-import':await mutate('/api/obsidian/import',{},button,'读书笔记导入完成，可在学习台查看。');break;case 'obsidian-preview':await previewObsidian(button);break;case 'automation-tick':await mutate('/api/automation/tick',{},button,'到期任务检查完成，请查看运行记录。');break;}});
document.addEventListener('submit',async event=>{const form=event.target;if(!(form instanceof HTMLFormElement))return;event.preventDefault();const values=Object.fromEntries(new FormData(form).entries()),button=event.submitter||form.querySelector('[type=submit]');switch(form.id){case 'quick-capture':if(!values.title.trim())return;await mutate('/api/petitions',{title:values.title.trim(),status:'已递交'},button,'想法已放入收件箱。');break;case 'checkin-form':if(!values.note.trim())return;await mutate('/api/checkins',{energy:Number(values.energy),note:values.note.trim(),blocker:values.blocker.trim(),tomorrow:values.tomorrow.trim()},button,'今天的记录已写入史馆。');break;case 'capture-form':if(!values.title.trim()){modalError('请填写标题。');return}await submitModal(form,'/api/petitions',{title:values.title.trim(),note:values.note.trim(),status:'已递交'},'想法已放入收件箱。');break;case 'task-form':{if(!values.title.trim()){modalError('请填写行动内容。');return}const data={title:values.title.trim(),goalId:values.goalId||null,dueAt:values.dueAt?new Date(values.dueAt).toISOString():null};if(!form.dataset.id){data.dept=values.dept;data.priority=values.priority;if(values.minutes)data.minutes=Number(values.minutes)}await submitModal(form,'/api/tasks'+(form.dataset.id?'/'+encodeURIComponent(form.dataset.id):''),data,form.dataset.id?'行动已更新。':'新行动已加入清单。',form.dataset.id?'PATCH':'POST');break}case 'goal-form':if(!values.title.trim()){modalError('请填写目标。');return}await submitModal(form,'/api/goals',{title:values.title.trim(),why:values.why.trim(),targetDate:values.targetDate||null},'目标已保存，可以为它添加行动。');break;case 'complete-form':if(!values.evidence.trim()){modalError('请写下一份完成证据。');return}await submitModal(form,'/api/tasks/'+encodeURIComponent(form.dataset.id),{status:'已完成',evidence:values.evidence.trim()},'行动已完成，证据已归档。','PATCH');break;case 'reading-import-form':{if(!values.text.trim()){modalError('请粘贴笔记内容或选择文件。');return}let payload={text:values.text,format:values.format,title:values.title.trim()};if(values.format==='json'){try{const parsed=JSON.parse(values.text);payload={items:Array.isArray(parsed)?parsed:Array.isArray(parsed.items)?parsed.items:[parsed]}}catch(error){modalError('JSON 格式有误：'+error.message);return}}await submitModal(form,'/api/reading/import',payload,'笔记已导入，开始一次主动回忆吧。');break}case 'reading-review-form':if(!values.answer.trim()){modalError('请先写下自己的回忆内容。');return}await submitModal(form,'/api/reading/'+encodeURIComponent(form.dataset.id)+'/review',{answer:values.answer.trim(),rating:button.value},'回忆已记录，下次复习时间已更新。','POST',button);break;case 'reading-task-form':if(!values.title.trim()){modalError('请描述一个具体练习。');return}await submitModal(form,'/api/reading/'+encodeURIComponent(form.dataset.id)+'/task',{title:values.title.trim()},'练习已加入行动清单。');break;case 'vault-settings':await mutate('/api/settings',{vaultPath:values.vaultPath.trim(),readingFolder:values.readingFolder.trim()},button,'笔记库配置已保存。');break;case 'ai-settings':await mutate('/api/settings',{ai:{enabled:values.enabled==='on',baseUrl:values.baseUrl.trim(),model:values.model.trim()}},button,'模型配置已保存，尚未发送任何分析请求。');break;case 'automation-form':await mutate('/api/automation/config',{enabled:values.enabled==='on',dailyHour:Number(values.dailyHour),weeklyDay:Number(values.weeklyDay),weeklyHour:Number(values.weeklyHour),autoImport:values.autoImport==='on'},button,'自动整理设置已保存。','PATCH');break;case 'obsidian-export-form':await submitModal(form,'/api/obsidian/export',{previewId:form.dataset.previewId,approved:true},'批准的文件已写入笔记库。');break;case 'ai-question':if(!values.question.trim())return;await perform('ai-preview',button,async()=>{const preview=await api('/api/ai/preview',{method:'POST',body:JSON.stringify({question:values.question.trim()})});openAiPreview(values.question.trim(),preview)});break;case 'ai-run-form':await perform('ai-run',button,async()=>{const result=await api('/api/ai/run',{method:'POST',body:JSON.stringify({previewId:form.dataset.previewId,question:values.question,approved:true})});closeModal(true);await refresh();openModal('模型分析结果','结合自己的情况判断建议，再决定下一步。',analysisBody(result.analysis||result)+`<div class="modal-actions"><button class="button primary" data-close-modal>读完了</button></div>`,true)},true);break;}});

document.addEventListener('change',async event=>{if(event.target.id!=='import-file')return;const file=event.target.files?.[0];if(!file)return;if(file.size>900*1024){modalError('文件超过 900 KB，请拆成更小的笔记后导入。');event.target.value='';return}try{const text=await file.text();if(!$('#import-text'))return;$('#import-text').value=text;$('#import-format').value=/\.json$/i.test(file.name)?'json':/\.(md|markdown)$/i.test(file.name)?'markdown':'text';if(!$('#import-title').value)$('#import-title').value=file.name.replace(/\.[^.]+$/,'')}catch(error){modalError('无法读取这个文件：'+error.message)}});
$('#modal-backdrop').addEventListener('click',event=>{if(event.target===$('#modal-backdrop'))closeModal()});
document.addEventListener('keydown',event=>{if($('#modal-backdrop').hidden)return;if(event.key==='Escape'){event.preventDefault();closeModal();return}if(event.key==='Tab'){const focusable=$$('button:not(:disabled),input:not([type=hidden]):not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],summary,[tabindex="0"]',$('#modal')).filter(node=>node.getClientRects().length);if(!focusable.length){event.preventDefault();$('#modal').focus();return}const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===$('#modal'))){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
